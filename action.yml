name: Sciurus
description: Validate MySQL ER models, diff schemas, and check model/SQL consistency.
branding:
  icon: database
  color: blue

inputs:
  version:
    description: Published Sciurus binary release, such as v0.1.2. Independent of the action reference.
    required: true
  command:
    description: Operation to run, either validate or diff.
    default: validate
  model:
    description: Model JSON file to validate, relative to the workspace or absolute.
  before:
    description: Model JSON or SQL file before a schema change.
  after:
    description: Model JSON or SQL file after a schema change.
  format:
    description: Diff report format, either text or png.
    default: text
  output:
    description: Diff report destination. Defaults to a unique file in the runner temporary directory.
  fail-on-changes:
    description: Fail when a diff finds database changes, for model/SQL consistency checks.
    default: 'false'

outputs:
  changed:
    description: Whether a completed diff found database changes, as true or false. Empty for validation or errors.
    value: ${{ steps.run.outputs.changed }}
  report:
    description: Absolute path to the completed diff report, including when fail-on-changes fails the action.
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    - name: Install verified Sciurus release
      shell: bash
      env:
        SCIURUS_ACTION_PATH: ${{ github.action_path }}
        SCIURUS_VERSION: ${{ inputs.version }}
      run: bash "$SCIURUS_ACTION_PATH/scripts/install-action.sh"

    - name: Run Sciurus
      id: run
      shell: bash
      env:
        SCIURUS_ACTION_PATH: ${{ github.action_path }}
        SCIURUS_COMMAND: ${{ inputs.command }}
        SCIURUS_MODEL: ${{ inputs.model }}
        SCIURUS_BEFORE: ${{ inputs.before }}
        SCIURUS_AFTER: ${{ inputs.after }}
        SCIURUS_FORMAT: ${{ inputs.format }}
        SCIURUS_OUTPUT: ${{ inputs.output }}
        SCIURUS_FAIL_ON_CHANGES: ${{ inputs.fail-on-changes }}
      run: bash "$SCIURUS_ACTION_PATH/scripts/action.sh"
