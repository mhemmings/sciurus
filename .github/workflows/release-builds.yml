# Called by CI for PR checks and tagged releases; no manual trigger is needed.
name: Build and check release archives

on:
  workflow_call:
    inputs:
      version:
        description: Version embedded in packaged binaries.
        type: string
        default: dev

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            os: linux
            arch: amd64
          - runner: ubuntu-26.04-arm
            os: linux
            arch: arm64
          - runner: ubuntu-26.04
            os: darwin
            arch: amd64
          - runner: ubuntu-26.04
            os: darwin
            arch: arm64
          - runner: ubuntu-26.04
            os: windows
            arch: amd64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Linux Go tests
        if: matrix.os == 'linux'
        env:
          CGO_ENABLED: '0'
        run: go test ./...
      - name: Build and check the archive
        env:
          VERSION: ${{ inputs.version }}
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: bash scripts/build-release.sh "$VERSION" "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ inputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          overwrite: true
