name: Test the Sciurus action

on:
  workflow_call:
    inputs:
      version:
        description: Published binary release used by installer and action checks.
        type: string
        # CI needs an existing release; checks after publication pass the new tag.
        default: v0.1.1

permissions:
  contents: read

jobs:
  test:
    name: Composite action tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check release installation and checksum failures
        run: bash scripts/test-install-action.sh
      # The $/ reference tests the root composite action at this workflow's commit.
      - name: Validate a bundled model with the Sciurus action
        uses: $/
        with:
          version: ${{ inputs.version }}
          model: examples/starter.json
      - name: Exercise action behavior
        run: bash scripts/test-action.sh
      - name: Prepare changed schemas
        run: |
          printf 'CREATE TABLE task (id INT NOT NULL);\n' > "$RUNNER_TEMP/before.sql"
          printf 'CREATE TABLE task (id INT NOT NULL, title VARCHAR(80) NULL);\n' > "$RUNNER_TEMP/after.sql"
      - name: Reject schema changes with the Sciurus action
        id: difference
        continue-on-error: true
        uses: $/
        with:
          version: ${{ inputs.version }}
          command: diff
          before: ${{ runner.temp }}/before.sql
          after: ${{ runner.temp }}/after.sql
          format: png
          fail-on-changes: 'true'
      - name: Check failed action outputs
        env:
          OUTCOME: ${{ steps.difference.outcome }}
          CHANGED: ${{ steps.difference.outputs.changed }}
          REPORT: ${{ steps.difference.outputs.report }}
        run: |
          test "$OUTCOME" = failure
          test "$CHANGED" = true
          test -s "$REPORT"
          test "$(od -An -tx1 -N8 "$REPORT" | tr -d ' \n')" = 89504e470d0a1a0a
